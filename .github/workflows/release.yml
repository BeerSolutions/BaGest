name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - id: get-version-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_MAJOR_VERSION="${RELEASE_VERSION%%.*}"
          remaining_version="${RELEASE_VERSION#*.}"
          RELEASE_MINOR_VERSION="${RELEASE_MAJOR_VERSION}.${remaining_version%%.*}"
          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "RELEASE_MINOR_VERSION=$RELEASE_MINOR_VERSION"
            echo "RELEASE_MAJOR_VERSION=$RELEASE_MAJOR_VERSION"
          } >> "$GITHUB_OUTPUT"
    outputs:
      RELEASE_VERSION: ${{ steps.get-version-tag.outputs.RELEASE_VERSION }}
      RELEASE_MINOR_VERSION: ${{ steps.get-version-tag.outputs.RELEASE_MINOR_VERSION }}
      RELEASE_MAJOR_VERSION: ${{ steps.get-version-tag.outputs.RELEASE_MAJOR_VERSION }}

  verify:
    name: Run tests
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --verbosity normal

  release_zip:
    needs: [version, verify]
    name: Release BaGest.zip to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        run: |
          dotnet publish src/BaGest --configuration Release --output artifacts --property:Version="$RELEASE_VERSION"
          echo "$GITHUB_SHA" > artifacts/ReleaseSha.txt
          7z a -tzip "bagest-$RELEASE_VERSION.zip" ./artifacts/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "bagest-$RELEASE_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_VERSION" --generate-notes $prerelease

  # Requires repository variable PUBLISH_NUGET=true and secret NUGET_API_KEY.
  release_packages:
    if: ${{ vars.PUBLISH_NUGET == 'true' }}
    needs: [version, verify]
    name: Release packages to nuget.org
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pack
        run: dotnet pack --configuration Release --output artifacts --property:Version="$RELEASE_VERSION"
      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        working-directory: artifacts

  release_docker_image:
    needs: [version, verify]
    name: Release Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/beersolutions/bagest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(needs.version.outputs.RELEASE_VERSION, '0.') }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            Version=${{ needs.version.outputs.RELEASE_VERSION }}

  # Disabled unless repository variables PUBLISH_HELM_CHART=true and HELM_CHART_REPO
  # (e.g. "BeerSolutions/helm-chart-repo", must have a gh-pages branch) are set,
  # together with secret HELM_CHART_REPO_TOKEN (PAT with contents:write on that repo).
  release_helm_chart:
    if: ${{ vars.PUBLISH_HELM_CHART == 'true' && vars.HELM_CHART_REPO != '' }}
    needs: [version, verify]
    name: Release Helm chart
    runs-on: ubuntu-latest
    env:
      CHART_DIR: deployment templates/chart/bagest
      CHART_REPO: ${{ vars.HELM_CHART_REPO }}
      CHART_REPO_BRANCH: gh-pages
      CR_VERSION: 1.10.1
      CR_TOKEN: ${{ secrets.HELM_CHART_REPO_TOKEN }}
      RELEASE_VERSION: ${{ needs.version.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - name: Update version in helm chart
        run: |
          V="$RELEASE_VERSION" yq -i '.version = strenv(V) | .appVersion = strenv(V)' "$CHART_DIR/Chart.yaml"
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Install chart releaser
        run: |
          curl -sSL "https://github.com/helm/chart-releaser/releases/download/v${CR_VERSION}/chart-releaser_${CR_VERSION}_linux_amd64.tar.gz" \
            | sudo tar zxf - -C /usr/local/bin cr
      - name: Package chart
        run: |
          helm dependency update "$CHART_DIR"
          cr package "$CHART_DIR" --package-path .cr-release-packages
      - name: Upload packages
        run: |
          cr upload --commit "$CHART_REPO_BRANCH" --git-repo "${CHART_REPO#*/}" --owner "${CHART_REPO%%/*}" \
            --token "$CR_TOKEN" --package-path .cr-release-packages --skip-existing
      - name: Update charts index
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          mkdir -p .cr-index
          cr index --git-repo "${CHART_REPO#*/}" --owner "${CHART_REPO%%/*}" --token "$CR_TOKEN" \
            --pages-branch "$CHART_REPO_BRANCH" --package-path .cr-release-packages --index-path .cr-index --push
